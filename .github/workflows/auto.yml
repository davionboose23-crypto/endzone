# Scheduled prospective archive (user-approved override of spec §23's no-schedule rule).
# Captures pregame snapshots strictly before kickoff (first + latest), grades finished games once official stats
# exist, updates lessons/validation, runs the weekly auto-calibration gate (Tuesdays), commits archive/ changes
# with GITHUB_TOKEN only, and rebuilds + redeploys Pages. The usage-model leg of the blend challenger is refit from
# nflverse pre-game usage (scripts/usage/build.mjs) on the Tuesday run / manual runs, or whenever a week's table is missing. Drive patterns (scripts/drives/build.mjs) follow the same cadence; on Tuesdays (--fit) the drive-pattern adjustment is re-fit and re-tested walk-forward (archive/drives/fit.json) and the gate decides whether the active model uses it. Times are UTC; GitHub may delay scheduled runs.
name: Archive, grade and redeploy
on:
  schedule:
    - cron: '*/30 23 * * 4'    # Thu 23:00-23:30
    - cron: '*/30 0-5 * * 5'   # Fri 00:00-05:30 (Thursday night game)
    - cron: '*/30 16-23 * * 0' # Sun 16:00-23:30
    - cron: '*/30 0-5 * * 1'   # Mon 00:00-05:30 (Sunday night)
    - cron: '*/30 23 * * 1'    # Mon 23:00-23:30
    - cron: '*/30 0-5 * * 2'   # Tue 00:00-05:30 (Monday night)
    - cron: '0 12 * * 2'       # Tue 12:00 weekly: final stats, gate, fits
  workflow_dispatch:
    inputs:
      gate:
        description: Run the weekly auto-calibration gate too
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: endzone-archive-pages
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch fresh nflverse rows (for the Pages bundle)
        run: npm run bundle:nflverse
      - name: Usage model leg (weekly refit; otherwise only when this or next week's table is missing)
        continue-on-error: true   # if nflverse is down, the challenger falls back to 50/50 model + Sleeper
        run: |
          if [ "${{ github.event.schedule }}" = "0 12 * * 2" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/usage/build.mjs
          else
            node scripts/usage/build.mjs --if-missing
          fi
      - name: Drive patterns (weekly rebuild; otherwise only when this or next week's file is missing)
        continue-on-error: true   # if nflverse is down the app keeps last week's drive file (and its weight)
        run: |
          if [ "${{ github.event.schedule }}" = "0 12 * * 2" ] || [ "${{ inputs.gate }}" = "true" ]; then
            node scripts/drives/build.mjs --fit   # Tuesday: re-fit + re-test the drive-pattern adjustment walk-forward
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/drives/build.mjs
          else
            node scripts/drives/build.mjs --if-missing
          fi
      - name: Play-by-play simulator params (this + next week; refit weekly, otherwise only when missing)
        continue-on-error: true   # if nflverse is down the app keeps last week's params (play-by-play mode falls back to the drive sim)
        run: |
          if [ "${{ github.event.schedule }}" = "0 12 * * 2" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/pbp/build.mjs
          else
            node scripts/pbp/build.mjs --if-missing
          fi
      - name: Capture snapshots, grade, update lessons and validation
        run: node scripts/auto-run.mjs
      - name: Weekly auto-calibration gate
        if: github.event.schedule == '0 12 * * 2' || inputs.gate == true
        run: node scripts/gate.mjs
      - name: Commit archive changes (idempotent)
        run: |
          git config user.name "endzone-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive src/calibration-fits.json
          if git diff --cached --quiet -- archive src/calibration-fits.json ':!archive/runs'; then
            echo "No archive changes."; git reset -q
          else
            git commit -q -m "archive: snapshots/grades/lessons $(date -u +%Y-%m-%dT%H:%MZ)"
            ok=0; for i in 1 2 3; do if git pull --rebase --autostash -q origin main && git push -q origin HEAD:main; then ok=1; break; fi; sleep 5; done
            test "$ok" = 1 || { echo "push failed"; exit 1; }
          fi
      - name: Build site
        run: bash scripts/build-site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
