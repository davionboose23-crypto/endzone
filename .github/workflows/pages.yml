# Builds the standalone single-file app with FRESH nflverse data (fetched server-side on the
# runner, where browser CORS does not apply) and publishes it to GitHub Pages as index.html.
# Triggers: manual "Run workflow" button, pushes to main, and (app 4.12.0) a daily 15:00 UTC (10 AM CT) refresh so rosters,
# snap shares and injury designations in the bundle never go more than a day stale between game days. The scheduled
# archive/grade job lives in auto.yml. Live Sleeper team/injury/practice status is still re-read at every page load.
name: Refresh data and deploy Pages
on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * *'   # daily roster / injury / snaps refresh
  push:
    branches: [main]
    paths-ignore: ['archive/**']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: endzone-archive-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch fresh nflverse rows
        run: npm run bundle:nflverse
      - name: Build site (standalone app + shared archive)
        run: bash scripts/build-site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
