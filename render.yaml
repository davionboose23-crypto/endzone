# Render Blueprint. Secrets are not stored here: ENDZONE_WRITE_TOKEN is generated by Render
# (or set ENDZONE_TOKEN in the dashboard to make the whole site private).
services:
  - type: web
    name: endzone
    runtime: docker
    plan: starter          # a persistent disk requires a paid instance
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: ENDZONE_DATA_DIR
        value: /data
      - key: ENDZONE_WRITE_TOKEN
        generateValue: true
      - key: ENDZONE_TOKEN
        sync: false
    disk:
      name: endzone-data
      mountPath: /data
      sizeGB: 1
