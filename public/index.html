<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ENDZONE · Anytime TD Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <div class="brand"><div class="eyebrow">ANYTIME TD MODEL</div><h1 class="wordmark">ENDZONE</h1></div>
  <div class="controls" role="group" aria-label="Season and week">
    <span id="seasonLabel" class="season" aria-label="Season"></span>
    <button id="prevWeek" class="btn icon" aria-label="Previous week">‹</button>
    <label class="sr-only" for="weekSelect">Week</label>
    <select id="weekSelect" class="select" aria-label="Week"></select>
    <button id="nextWeek" class="btn icon" aria-label="Next week">›</button>
    <button id="focusBtn" class="btn" aria-pressed="false" title="Focus view: chance, TD confidence and one primary yardage line">Focus</button>
    <button id="refreshBtn" class="btn gold">Refresh</button>
  </div>
  <div id="status" class="status" role="status" aria-live="polite"></div>
</header>
<nav class="tabs" role="tablist" aria-label="Views">
  <button role="tab" id="tab-slate" aria-controls="view-slate" aria-selected="true" class="tab">Slate</button>
  <button role="tab" id="tab-board" aria-controls="view-board" aria-selected="false" class="tab" tabindex="-1">Board</button>
  <button role="tab" id="tab-trends" aria-controls="view-trends" aria-selected="false" class="tab" tabindex="-1">Trends</button>
  <button role="tab" id="tab-drives" aria-controls="view-drives" aria-selected="false" class="tab" tabindex="-1">Drives</button>
  <button role="tab" id="tab-lab" aria-controls="view-lab" aria-selected="false" class="tab" tabindex="-1">Lab</button>
</nav>
<main id="main">
  <section id="loading" class="loading" hidden aria-live="polite"></section>
  <section id="view-slate" role="tabpanel" aria-labelledby="tab-slate" class="view"></section>
  <section id="view-board" role="tabpanel" aria-labelledby="tab-board" class="view" hidden></section>
  <section id="view-trends" role="tabpanel" aria-labelledby="tab-trends" class="view" hidden></section>
  <section id="view-drives" role="tabpanel" aria-labelledby="tab-drives" class="view" hidden></section>
  <section id="view-lab" role="tabpanel" aria-labelledby="tab-lab" class="view" hidden></section>
</main>
<aside id="panel" class="panel" hidden aria-labelledby="panelTitle"></aside>
<div id="scrim" class="scrim" hidden></div>
<footer class="foot">Research model, not a sportsbook. The anytime number is a probability. Edge is that probability minus the published projection, not a sportsbook price. Rosters are current, so a midseason trade can put an earlier week on the new team.</footer>
<script type="module" src="/app.js"></script>
</body>
</html>
